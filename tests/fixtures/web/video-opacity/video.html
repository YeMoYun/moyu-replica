<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>本地三平台透明化验收夹具（不是线上平台）</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111318;color:#eee;font-family:Arial,"Microsoft YaHei",sans-serif}header{height:64px;display:flex;align-items:center;padding:0 28px;gap:24px;border-bottom:1px solid #343740}header strong{font-size:24px}header input{background:#292b34;color:white;border:0;border-radius:12px;width:460px;padding:14px}aside{position:absolute;top:80px;left:20px;width:150px;line-height:48px;color:#aeb1bb}main{margin-left:188px;padding:20px;min-width:1040px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{height:256px;background:linear-gradient(145deg,#3a4766,#253034);border-radius:10px;position:relative;overflow:hidden}.card:nth-child(2n){background:linear-gradient(145deg,#654933,#304052)}.card span{position:absolute;left:14px;bottom:14px;font-size:18px}video{width:100%;height:100%;object-fit:cover}.feed{margin-top:20px;height:220px;overflow-y:auto;background:#20232b;padding:14px;line-height:38px}.feed div{height:880px}button{margin:12px 4px 0;background:#353944;border:1px solid #656b7d;color:white;padding:10px 18px;border-radius:6px}.player-fullscreen .grid{grid-template-columns:repeat(2,1fr)}
</style>
<header><strong>本地视频夹具</strong><input aria-label="搜索视频" placeholder="搜索内容（隔离测试）"><span>客户端　登录</span></header>
<aside>推荐<br>关注<br>朋友<br>我的<br>直播<br>音乐</aside>
<main><div class="grid"><div class="card"><video muted playsinline></video><span>真实 MediaStream 视频 1</span></div><div class="card"><video muted playsinline></video><span>真实 MediaStream 视频 2</span></div><div class="card"><span>窗内四列内容 · 3</span></div><div class="card"><span>窗内四列内容 · 4</span></div></div>
<button aria-label="上一条视频" onclick="document.body.dataset.prev=String(Number(document.body.dataset.prev||0)+1)">上一条视频</button><button aria-label="下一条视频" onclick="document.body.dataset.next=String(Number(document.body.dataset.next||0)+1)">下一条视频</button><button aria-label="播放器全屏" onclick="document.body.classList.toggle('player-fullscreen');document.body.dataset.fullscreen='clicked'">播放器内部铺满</button>
<section class="feed" aria-label="视频内部滚动区域"><div>内部滚动保留<br>视频条目 2<br>视频条目 3<br>视频条目 4<br>视频条目 5<br>视频条目 6<br>视频条目 7</div></section></main>
<script>
const site=new URLSearchParams(location.search).get("platform")||"bilibili"
const classes={bilibili:["bpx-player-ctrl-prev","bpx-player-ctrl-next","bpx-player-ctrl-full"],huya:["","","player-fullscreen-btn"],kuaishou:["xgplayer-prev","xgplayer-next","xgplayer-fullscreen"]}[site]
const buttons=[...document.querySelectorAll("button")];buttons.forEach((button,index)=>button.className=classes[index])
if(site==='huya'){const player=document.createElement('div');player.id='J_playerMain';player.dataset.huyaFixture='true';const grid=document.querySelector('.grid');grid.before(player);player.append(grid,buttons[2])}
const link=document.createElement("a");link.id="same-guest-link";link.target="_blank";link.href=`https://www.${site}.com/__moyu_fixture__/next?platform=${site}`;link.textContent="站内新窗口播放链接（本地测试）";document.querySelector("main").appendChild(link)

document.addEventListener('keydown',event=>{if(event.key==='ArrowDown'||event.key==='ArrowUp')document.body.dataset.key=event.key})
const canvas=document.createElement('canvas');canvas.width=320;canvas.height=240;const ctx=canvas.getContext('2d');let frame=0
function draw(){frame++;ctx.fillStyle=`hsl(${frame%360} 28% 24%)`;ctx.fillRect(0,0,320,240);ctx.fillStyle='#fff';ctx.font='22px sans-serif';ctx.fillText('LOCAL VIDEO',60,112);requestAnimationFrame(draw)}draw()
const stream=canvas.captureStream(15);document.querySelectorAll('video').forEach(video=>{video.srcObject=stream;video.play().catch(console.error)})
</script></html>
