<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>本地虎牙播放器几何验收（非真实虎牙）</title>
<style>body{margin:0;background:#ddd;font-family:sans-serif}.room{margin:90px 180px;transform:translateX(15px);height:400px;overflow:hidden}#J_playerMain{position:relative;width:520px;height:310px;background:#000}.video-container{width:100%;height:100%}video{width:100%;height:100%;object-fit:contain}.player-fullscreen-btn{position:absolute;right:12px;bottom:10px;z-index:5;background:#333;color:white;border:1px solid #fff;padding:8px}.chat{height:1800px}</style>
<header>直播间标题与导航</header><div class="room"><div id="J_playerMain"><div class="video-container"><video muted playsinline></video></div><button class="player-fullscreen-btn" title="全屏" onclick="document.body.dataset.nativeRequests=String(Number(document.body.dataset.nativeRequests||0)+1);document.querySelector('#J_playerMain').requestFullscreen().catch(e=>document.body.dataset.nativeError=e.message)">全屏/退出</button></div></div><aside class="chat">聊天区和其他内容</aside>
<script>const c=document.createElement('canvas');c.width=640;c.height=360;const ctx=c.getContext('2d');let n=0;function draw(){ctx.fillStyle=`hsl(${n++%360} 40% 25%)`;ctx.fillRect(0,0,640,360);ctx.fillStyle='white';ctx.font='28px sans-serif';ctx.fillText('LOCAL LIVE VIDEO',120,180);requestAnimationFrame(draw)}draw();const v=document.querySelector('video');v.srcObject=c.captureStream(15);v.play().catch(console.error)</script></html>
