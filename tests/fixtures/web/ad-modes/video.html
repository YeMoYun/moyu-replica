<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>离线广告视频夹具</title><style>body{margin:0;background:#1e293b;color:white;font:22px Arial}.xgplayer{position:relative;width:900px;height:550px}video{width:100%;height:100%}.controls{position:absolute;bottom:10px;left:10px}button{padding:8px;font-size:20px}</style><body><header>不应出现在广告小窗中的导航</header><div id="J_playerMain" class="xgplayer"><video muted playsinline></video><div class="controls"><button aria-label="上一条视频" onclick="document.body.dataset.prev='yes'">上一条</button><button aria-label="下一条视频" onclick="document.body.dataset.next='yes'">下一条</button><button class="player-fullscreen-btn" aria-label="播放器全屏" onclick="document.body.dataset.fullscreen='yes'">全屏</button><button aria-label="点赞" onclick="document.body.dataset.liked='yes'">点赞</button></div></div><script>const c=document.createElement('canvas');c.width=320;c.height=240;const x=c.getContext('2d');let f=0;function draw(){f++;x.fillStyle='#20384b';x.fillRect(0,0,320,240);x.fillStyle='white';x.font='20px Arial';x.fillText('OFFLINE VIDEO '+f,40,110);requestAnimationFrame(draw)}draw();const v=document.querySelector('video');v.srcObject=c.captureStream(10);v.play().catch(()=>{});</script></body></html>
